<style>
:root {

  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #171a21; --text: #e8eaef; --muted: #9098a6; --line: #2a2f3a;

.tab { white-space: nowrap; }

.cal { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 0 12px; font-size: 13.5px; }

  border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 500;
  box-shadow: 0 4px 14px rgb(0 0 0 / .15); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s; }

<div class="wrap">
  <header>
    <h1>Daily Stock Insights <span class="by">BY YOONSEUL</span></h1>
    <span class="updated"><span id="updated">불러오는 중…</span> · <a class="easy-link" href="easy/">🌱 주식이 처음이라면 쉽게 보기</a> <button type="button" class="reload" onclick="location.reload()" title="새로고침">↻ 새로고침</button></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="stamp" id="stamp"></div>
  <main id="main"></main>
</div>
<button class="to-top" id="toTop" type="button">↑ 목록으로</button>

<script src="schedule.js"></script>
<script>
const LWC = LightweightCharts;
let DATA, current, observer, charts = [];

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = (a, b) => (a != null && b != null && b !== 0) ? (a / b - 1) * 100 : null;
const firstValid = arr => arr.find(v => v != null);
const lastValid = (arr, skip = 0) => { let n = 0; for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null && n++ === skip) return arr[i]; return null; };
const fmtPct = v => v == null ? '–' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
const fmtPp = v => v == null ? '–' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%p</span>`;
const fmtPrice = (v, cur) => v == null ? '–' : cur === 'KRW' ? v.toLocaleString('ko-KR') + '원' : '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// 코스피·코스닥은 네이버 증권, 미국 종목은 야후 파이낸스 상세 페이지로 연결
const tickerLink = t => {
  const kr = /\.K[SQ]$/.test(t), code = t.replace(/\.K[SQ]$/, '');
  const url = kr ? `https://finance.naver.com/item/main.naver?code=${code}` : `https://finance.yahoo.com/quote/${code}`;
  return `<a class="tk" href="${url}" target="_blank" rel="noopener" title="${code} 상세 정보 보기">${code}</a>`;
};

const fmtCap = (v, cur) => {
  if (v == null) return '–';
  if (cur === 'KRW') return v >= 1e14 ? Math.round(v / 1e12).toLocaleString('ko-KR') + '조' : v >= 1e12 ? (v / 1e12).toFixed(1) + '조' : Math.round(v / 1e8).toLocaleString('ko-KR') + '억';
  return v >= 1e12 ? '$' + (v / 1e12).toFixed(2) + 'T' : '$' + Math.round(v / 1e9).toLocaleString('en-US') + 'B';
};

function stats(closes) {
  const last = lastValid(closes);
  return {
    last,
    d1: pct(last, lastValid(closes, 1)),
    d5: pct(last, lastValid(closes, 5)),
    d10: pct(last, lastValid(closes, 10)),
    m1: pct(last, lastValid(closes, 21)),
    all: pct(last, firstValid(closes)),
  };
}

async function init() {
  DATA = await (await fetch('data.json', { cache: 'no-cache' })).json();
  const ORDER = ['sp500', 'nasdaq', 'dow', 'kospi', 'kosdaq'];  // 탭 순서
  DATA.markets.sort((a, b) => (ORDER.indexOf(a.id) + 1 || 99) - (ORDER.indexOf(b.id) + 1 || 99));
  document.getElementById('updated').textContent = `${priceBasis(DATA)} · 차트는 최근 90일`;
  const tabs = document.getElementById('tabs');
  DATA.markets.forEach(m => {
    const b = document.createElement('button');
    b.className = 'tab'; b.textContent = m.label; b.role = 'tab'; b.dataset.id = m.id;
    b.onclick = () => { location.hash = m.id; };
    tabs.appendChild(b);
  });
  const bf = document.createElement('button');
  bf.className = 'tab'; bf.textContent = '브리핑·일정'; bf.role = 'tab'; bf.dataset.id = 'brief';
  bf.onclick = () => { location.hash = 'brief'; };
  tabs.appendChild(bf);
  const bt = document.createElement('button');
  bt.className = 'tab'; bt.textContent = '시장 흐름'; bt.role = 'tab'; bt.dataset.id = 'breadth';
  bt.onclick = () => { location.hash = 'breadth'; };
  tabs.appendChild(bt);
  const et = document.createElement('button');
  et.className = 'tab'; et.textContent = '실적 조회'; et.role = 'tab'; et.dataset.id = 'earnings';
  et.onclick = () => { location.hash = 'earnings' + (erTicker ? '/' + erTicker : ''); };
  tabs.appendChild(et);
  const gt = document.createElement('button');
  gt.className = 'tab'; gt.textContent = '용어 설명'; gt.role = 'tab'; gt.dataset.id = 'glossary';
  gt.onclick = () => { location.hash = 'glossary'; };
  tabs.appendChild(gt);
  try { BRIEF = await (await fetch('briefing.json', { cache: 'no-cache' })).json(); } catch (e) {}
  window.addEventListener('hashchange', route);
  route();
  setInterval(setStamp, 60e3);
  autoRefresh(['data.json', 'briefing.json']);
}

const marketUpdated = id => DATA.markets.find(m => m.id === id)?.updated || DATA.updated;

// 지금 보고 있는 탭의 '마지막 업데이트 · 다음 업데이트 예정'
function setStamp() {
  const id = location.hash.slice(1);
  let text;
  if (id.startsWith('glossary')) text = stampText(null);
  else if (id === 'brief') text = stampText('brief', BRIEF?.updated);
  else if (id.startsWith('earnings')) {
    const t = decodeURIComponent(id.split('/')[1] || ''), kr = /\.K[SQ]$/.test(t);
    const upd = DATA.markets.find(m => kr === ['kospi', 'kosdaq'].includes(m.id))?.updated || DATA.updated;
    text = (t ? stampText(kr ? 'kr' : 'us', upd) : `미국 ${stampText('us', marketUpdated('sp500')).slice(3)} | 한국 ${stampText('kr', marketUpdated('kospi')).slice(3)}`)
      + ' · 회사 사업 설명 글은 직접 정리해서 날짜가 따로 적혀 있어요';
  } else {
    const m = DATA.markets.find(x => x.id === id) || DATA.markets[0];
    text = id === 'breadth' ? stampText('us', marketUpdated('sp500')) : stampText(['kospi', 'kosdaq'].includes(m.id) ? 'kr' : 'us', marketUpdated(m.id));
  }
  document.getElementById('stamp').textContent = text;
}

// 각 시장의 마지막 거래일과, 데이터를 받은 시각에 그 장이 끝났는지
function priceBasis(data) {

  const usDst = d => {  // 미국 서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일
    const y = d.getUTCFullYear(), sun = (m, n) => { const x = new Date(Date.UTC(y, m, 1)); return Date.UTC(y, m, 1 + (7 - x.getUTCDay()) % 7 + 7 * (n - 1)); };
    return d >= sun(2, 2) && d < sun(10, 1);
  };
  const part = (label, id, closeUtc) => {
    const m = data.markets.find(x => x.id === id);
    if (!m) return '';
    const at = new Date((m.updated || data.updated).replace(' ', 'T').replace(' KST', ':00+09:00'));
    const day = m.dates.at(-1), d = new Date(day + 'T00:00:00Z');
    const close = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), ...closeUtc(d)));
    return `${label} ${+day.slice(5, 7)}/${+day.slice(8)} ${at >= close ? '마감' : '장중'}`;
  };
  return '주가 기준: ' + [part('미국', 'sp500', d => usDst(d) ? [20, 15] : [21, 15]), part('한국', 'kospi', () => [6, 45])].filter(Boolean).join(' · ');
}

function route() {
  const id = location.hash.slice(1);
  setStamp();
  if (id.startsWith('glossary')) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === 'glossary'));
    current = null;
    renderGlossary(id.split('/')[1]);
    return;
  }
  if (id === 'brief') {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === 'brief'));
    current = null;
    renderBrief();
    return;
  }
  if (id === 'breadth') {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === 'breadth'));
    current = null;
    renderBreadth();
    return;
  }
  if (id.startsWith('earnings')) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === 'earnings'));
    current = null;
    renderEarnings(decodeURIComponent(id.split('/')[1] || ''));
    return;
  }
  const m = DATA.markets.find(x => x.id === id) || DATA.markets[0];
  if (current === m) return;
  current = m;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === m.id));
  render(m);
}

let sortKey = 'excess', sortDir = -1;

function render(m) {
  charts.forEach(c => c.remove()); charts = [];
  if (observer) observer.disconnect();

  const idx = stats(m.index.c);
  m.rows = m.stocks.map((s, i) => { const st = stats(s.c); return { i, s, ...st, cap: s.cap ?? null, rank: s.rank ?? null, excess: st.all != null && idx.all != null ? st.all - idx.all : null }; });

  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="card idx">
      <span class="name">${m.index.name}</span>
      <span class="big">${idx.last?.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>
      <span class="stat">1일 <b>${fmtPct(idx.d1)}</b></span>
      <span class="stat">1개월 <b>${fmtPct(idx.m1)}</b></span>
      <span class="stat">${m.dates.length}거래일 <b>${fmtPct(idx.all)}</b></span>
      ${m.index.pe?.value ? `<span class="stat" title="지수 PER은 지수를 그대로 따라가는 ETF(${esc(m.index.pe.etf)})의 PER(최근 1년 이익 기준)이에요">PER <b>${m.index.pe.value.toFixed(1)}배</b> <span style="font-size:11px">(${esc(m.index.pe.etf)} 기준)</span></span>` : ''}
    </section>
    <section class="card">
      <div class="table-wrap"><table class="mk">
        <thead><tr>
          <th data-k="n">#</th><th data-k="name">종목</th><th data-k="last">현재가</th>
          <th data-k="cap">시총</th><th data-k="rank">순위</th>
          <th data-k="d1">1일</th><th data-k="d5">5일</th><th data-k="d10">10일</th><th data-k="m1">1개월</th><th data-k="all">기간</th><th data-k="excess">지수 대비</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
      <div class="note">'기간'은 차트 시작일(${DATA.start}) 이후 수익률이고, '지수 대비'는 그 수익률에서 ${m.index.name} 수익률을 뺀 값이고, '순위'는 이 목록 안에서의 시총 순위입니다. 표의 제목을 누르면 정렬되고, 행을 누르면 해당 종목 차트로 이동합니다.${m.missing.length ? ` 데이터 없음: ${m.missing.join(', ')}` : ''}</div>
    </section>
    <div class="list-head"><h2>종목별 차트</h2>
      <div class="seg" id="period">${PERIODS.map(p => `<button type="button" data-p="${p.k}" aria-pressed="${p.k === period}">${p.t}</button>`).join('')}</div></div>
    <div id="list"></div>`;
  main.querySelectorAll('#period button').forEach(b => b.onclick = () => {
    period = b.dataset.p;
    try { localStorage.setItem('period', period); } catch (e) {}
    main.querySelectorAll('#period button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderList(m);
  });

  main.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (k === 'n') return;
    sortDir = sortKey === k ? -sortDir : (k === 'name' || k === 'rank' ? 1 : -1);
    sortKey = k; renderTable(m);
  });
  renderTable(m);
  renderList(m);
}

// 종목별 차트 기간: 3개월(데이터 전체) · 1개월(21거래일) · 5일
const PERIODS = [{ k: '3m', t: '3개월', n: null }, { k: '1m', t: '1개월', n: 21 }, { k: '5d', t: '5일', n: 5 }];
let period = (() => { try { return localStorage.getItem('period') || '3m'; } catch (e) { return '3m'; } })();
if (!PERIODS.some(p => p.k === period)) period = '3m';
const periodStart = m => { const n = PERIODS.find(p => p.k === period).n; return n ? Math.max(0, m.dates.length - 1 - n) : 0; };

function renderList(m) {
  charts.forEach(c => c.remove()); charts = [];
  if (observer) observer.disconnect();
  const st = periodStart(m), label = PERIODS.find(p => p.k === period).t;
  const ret = c => pct(lastValid(c), firstValid(c.slice(st)));
  const iRet = ret(m.index.c);
  m.rows.forEach(r => { r.pAll = ret(r.s.c); r.pEx = r.pAll != null && iRet != null ? r.pAll - iRet : null; });
  const list = document.getElementById('list');
  // 차트는 고른 기간의 지수 대비(초과 수익률)가 큰 순서대로. 시장보다 못하면(지수 대비 −) 종목 선을 파란색으로
  const byExcess = [...m.rows].sort((a, b) => (b.pEx ?? -Infinity) - (a.pEx ?? -Infinity));
  list.innerHTML = byExcess.map(r => `
    <article class="card stock" id="s-${r.i}" data-i="${r.i}">
      <h3>${r.s.name}${tickerLink(r.s.ticker)}</h3>
      <div class="meta">${fmtPrice(r.last, m.currency)} · 시총 ${fmtCap(r.cap, m.currency)}${r.rank ? ` (${r.rank}위)` : ''} · 1일 ${fmtPct(r.d1)} · ${label} ${fmtPct(r.pAll)} · 지수 대비 ${fmtPp(r.pEx)}</div>
      <div class="charts">
        <div class="chart-box">
          <div class="legend"><span>캔들 (오른쪽 축)</span><span><i style="background:var(--index)"></i>${m.index.name} (왼쪽 축)</span></div>
          <div class="chart c1"></div>
        </div>
        <div class="chart-box">
          <div class="legend"><span><i style="background:${r.pEx < 0 ? 'var(--down)' : 'var(--stock)'}"></i>${r.s.name}</span><span><i style="background:var(--index)"></i>${m.index.name}</span><span>${label} 전 대비 %</span></div>
          <div class="chart c2"></div>
        </div>
      </div>
    </article>`).join('');

  observer = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    observer.unobserve(e.target);
    drawStock(m, m.stocks[+e.target.dataset.i], e.target, m.rows[+e.target.dataset.i].pEx, st);
  }), { rootMargin: '400px' });
  list.querySelectorAll('.stock').forEach(el => observer.observe(el));
}

function renderTable(m) {
  const rows = [...m.rows].sort((a, b) => {
    const x = sortKey === 'name' ? a.s.name : a[sortKey], y = sortKey === 'name' ? b.s.name : b[sortKey];
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  document.querySelectorAll('th').forEach(th => th.dataset.k === sortKey ? th.dataset.dir = sortDir > 0 ? '▲' : '▼' : delete th.dataset.dir);
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.map((r, n) => `
    <tr data-i="${r.i}">
      <td>${n + 1}</td>
      <td>${r.s.name}${tickerLink(r.s.ticker)}</td>
      <td>${fmtPrice(r.last, m.currency)}</td>
      <td>${fmtCap(r.cap, m.currency)}</td><td>${r.rank ?? '–'}</td>
      <td>${fmtPct(r.d1)}</td><td>${fmtPct(r.d5)}</td><td>${fmtPct(r.d10)}</td><td>${fmtPct(r.m1)}</td><td>${fmtPct(r.all)}</td><td>${fmtPp(r.excess)}</td>
    </tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr => tr.onclick = e => !e.target.closest('a') &&
    document.getElementById('s-' + tr.dataset.i).scrollIntoView({ behavior: 'smooth', block: 'start' }));
}

function baseOptions(leftVisible) {
  return {
    autoSize: true,
    layout: { background: { color: css('--card') }, textColor: css('--muted'), fontFamily: 'Noto Sans KR, system-ui, sans-serif' },
    grid: { vertLines: { color: css('--line') }, horzLines: { color: css('--line') } },
    rightPriceScale: { borderColor: css('--line') },
    leftPriceScale: { visible: leftVisible, borderColor: css('--line') },
    timeScale: { borderColor: css('--line') },
    handleScroll: false, handleScale: false,
    localization: { dateFormat: 'yyyy-MM-dd' },
  };
}

function drawStock(m, s, el, excess, st = 0) {
  const D = m.dates.slice(st), cut = a => a.slice(st);
  const up = css('--up'), down = css('--down'), idxColor = css('--index'), stockColor = excess < 0 ? down : css('--stock');

  const c1 = LWC.createChart(el.querySelector('.c1'), baseOptions(true));
  const candles = c1.addCandlestickSeries({ upColor: up, downColor: down, wickUpColor: up, wickDownColor: down, borderVisible: false });
  candles.setData(D.map((t, j) => { const i = j + st; return s.c[i] == null ? { time: t } : { time: t, open: s.o[i], high: s.h[i], low: s.l[i], close: s.c[i] }; }));
  const idxLine = c1.addLineSeries({ priceScaleId: 'left', color: idxColor, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  idxLine.setData(line(D, cut(m.index.c)));
  c1.timeScale().fitContent();

  const pctFmt = { type: 'custom', formatter: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%', minMove: 0.01 };
  const c2 = LWC.createChart(el.querySelector('.c2'), baseOptions(false));
  const iBase = firstValid(cut(m.index.c)), sBase = firstValid(cut(s.c));
  const pIdx = c2.addLineSeries({ color: idxColor, lineWidth: 2, priceFormat: pctFmt, priceLineVisible: false });
  pIdx.setData(line(D, cut(m.index.c).map(v => pct(v, iBase))));
  const pStock = c2.addLineSeries({ color: stockColor, lineWidth: 2, priceFormat: pctFmt, priceLineVisible: false });
  pStock.setData(line(D, cut(s.c).map(v => pct(v, sBase))));
  pStock.createPriceLine({ price: 0, color: css('--muted'), lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
  c2.timeScale().fitContent();

  charts.push(c1, c2);
}

const line = (dates, vals) => dates.map((t, i) => vals[i] == null ? { time: t } : { time: t, value: vals[i] });

const toTop = document.getElementById('toTop');
toTop.onclick = () => document.querySelector('.tabs').scrollIntoView({ behavior: 'smooth' });
addEventListener('scroll', () => {
  const list = document.getElementById('list');
  toTop.classList.toggle('show', !!list && list.getBoundingClientRect().top < innerHeight / 2);
}, { passive: true });

let BRIEF;
async function renderBrief() {
  charts.forEach(c => c.remove()); charts = [];
  if (observer) observer.disconnect();
  const main = document.getElementById('main');
  if (!BRIEF) {
    main.innerHTML = '<section class="card">불러오는 중…</section>';
    try { BRIEF = await (await fetch('briefing.json', { cache: 'no-cache' })).json(); }
    catch (e) { main.innerHTML = '<section class="card">브리핑을 불러오지 못했어요.</section>'; return; }
  }
  if (location.hash !== '#brief') return;
  const b = BRIEF;
  const sign = f => {
    const [c, lb] = f.sign === '+' ? ['var(--up)', '호재'] : f.sign === '-' ? ['var(--down)', '악재'] : ['var(--muted)', '혼재'];
    return `<div class="sg" style="color:${c};background:color-mix(in srgb, ${c} 14%, transparent)">${f.sign === '±' ? '±' : f.sign === '+' ? '+' : '−'}<small>${lb}</small></div>`;
  };
  const cal = rows => `<div class="cal">${rows.map(r => `<div class="d">${esc(r.date)}</div><div>${r.items.map(esc).join('<br>')}</div>`).join('')}</div>`;
  // 지난 일정: 항목마다 그 일 뒤 주가가 어떻게 움직였는지
  const react = t => { const m = /([+−-]\d+(\.\d+)?%)/.exec(t || ''); return m ? (m[1].startsWith('+') ? 'up' : 'down') : ''; };
  const pastCal = rows => `<div class="cal past">${rows.map(r => `<div class="d">${esc(r.date)}</div><div>${r.items.map(x =>
    `${esc(x.text)}<br><span class="rx ${react(x.reaction)}">↳ ${esc(x.reaction || '반응 확인 중')}</span>`).join('<br>')}</div>`).join('')}</div>`;
  const cnt = s => b.factors.filter(f => f.sign === s).length;
  main.innerHTML = `<div id="brief">
    <section class="card">
      <div class="t">시장 브리핑 · ${esc(b.asOf.slice(5).replace('-', '월 '))}일${b.updated ? ' ' + esc(b.updated.slice(11, 16)) : ''} 기준</div>
      <p class="sm">${esc(b.summary)} <span class="note" style="white-space:nowrap">(호재 ${cnt('+')} · 악재 ${cnt('-')} · 혼재 ${cnt('±')})</span></p>
    </section>
    <section class="card brief-cols">
      <div><h4>이번 주 주요 일정 (한국시간 기준)</h4>${cal(b.week)}
        ${b.weekPast?.length ? `<h4 style="margin-top:18px">이번 주 지난 일정 · 주가 반응</h4>${pastCal(b.weekPast)}` : ''}</div>
      <div><h4>앞으로 한 달 주요 일정</h4>${cal(b.month)}</div>
    </section>
    <section class="card">
      <h4>지금 주가에 영향을 주는 요인</h4>
      <div class="note" style="margin:0 0 6px">빨간 +는 주가에 좋은 요인(호재), 파란 −는 나쁜 요인(악재), 회색 ±는 양쪽으로 읽힐 수 있는 요인이에요.</div>
      ${b.factors.map(f => `<div class="factor">${sign(f)}<div><div class="ft">${esc(f.title)}</div><div class="fh">${esc(f.head)}</div>
        <p>${esc(f.detail)}</p><p class="st"><b>진행 상황:</b> ${esc(f.status)}</p></div></div>`).join('')}
      <div class="note" style="margin-top:12px">한국시간 02:00 · 06:30 · 11:00 · 15:00 · 19:00 · 22:00 · 23:30에 뉴스를 모아 새로 정리해요. 실적 발표 시간은 회사 사정으로 바뀔 수 있어요.
        출처: ${b.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(' · ')}</div>
    </section></div>`;
}

let BR;
const brColor = v => {
  const c = v >= 50 ? 'var(--up)' : 'var(--down)', a = Math.min(Math.abs(v - 50) * 1.4, 60);
  return `background: color-mix(in srgb, ${c} ${a.toFixed(0)}%, transparent)`;
};
const brMood = v => v >= 80 ? '과열권' : v >= 60 ? '강한 편' : v > 40 ? '중립' : v > 20 ? '약한 편' : '과매도권';

  const h = b.history;

  const pctFmt = { type: 'custom', formatter: v => v.toFixed(0) + '%', minMove: 0.1 };
  const s50 = c.addLineSeries({ priceScaleId: 'left', color: css('--c1'), lineWidth: 2, priceFormat: pctFmt, priceLineVisible: false });
  s50.setData(line(h.dates, h['50']));
  const s200 = c.addLineSeries({ priceScaleId: 'left', color: css('--c3'), lineWidth: 2, priceFormat: pctFmt, priceLineVisible: false });

  const si = c.addLineSeries({ color: css('--index'), lineWidth: 1, priceLineVisible: false });

  c.timeScale().fitContent();

}

let ER, BIZ = {}, SEG = {}, erTicker = '', erMode = 'q';
try { erMode = localStorage.getItem('erMode') || 'q'; } catch (e) {}
const POPULAR = ['NVDA', 'AAPL', 'MSFT', 'TSLA', '005930.KS', '000660.KS', '196170.KQ'];
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtEps = (v, cur) => v == null ? '–' : cur === 'KRW' ? Math.round(v).toLocaleString('ko-KR') + '원' : '$' + v.toFixed(2);
const fmtX = v => v == null ? '–' : v.toFixed(1) + '배';
const fmtD = v => v == null ? '–' : v.slice(2).replace(/-/g, '.');
const sumR = (...a) => a.some(v => v == null) ? null : (a.reduce((p, v) => p * (1 + v / 100), 1) - 1) * 100;
const beatBadge = b => b == null ? '–' : b > 0 ? '<span class="badge beat">상회</span>' : b < 0 ? '<span class="badge miss">하회</span>' : '<span class="badge meet">부합</span>';

function findTicker(q) {
  q = q.trim(); if (!q) return null;
  const st = ER.stocks, up = q.toUpperCase();
  const m = q.match(/\(([^)]+)\)\s*$/);
  if (m) { const code = m[1].toUpperCase(); const t = Object.keys(st).find(t => t === code || t.replace(/\.K[SQ]$/, '') === code); if (t) return t; }
  return Object.keys(st).find(t => t === up || t.replace(/\.K[SQ]$/, '') === up)
    || Object.keys(st).find(t => st[t].name === q)
    || Object.keys(st).find(t => st[t].name.includes(q) || (st[t].longName || '').toUpperCase().includes(up))
    || null;
}

async function renderEarnings(ticker) {
  charts.forEach(c => c.remove()); charts = [];
  if (observer) observer.disconnect();
  const main = document.getElementById('main');
  if (!ER) {
    main.innerHTML = '<section class="card">실적 데이터를 불러오는 중…</section>';
    try {
      [ER, BIZ, SEG] = await Promise.all([
        fetch('earnings.json', { cache: 'no-cache' }).then(r => r.json()),
        fetch('business.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
        fetch('segments.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      ]);
    }
    catch (e) { main.innerHTML = `<section class="card">실적 데이터를 불러오지 못했습니다: ${esc(e.message)}</section>`; return; }
  }
  if (ticker && !ER.stocks[ticker]) ticker = findTicker(ticker) || '';
  erTicker = ticker;
  main.innerHTML = `
    <section class="card">
      <div class="search">
        <div class="sugg-wrap">
          <input id="erInput" type="search" enterkeyhint="search" placeholder="티커 또는 종목명 입력 (예: NVDA, 삼성전자)" autocomplete="off"
            value="${ticker ? esc(ER.stocks[ticker].name + ' (' + ticker.replace(/\.K[SQ]$/, '') + ')') : ''}">
          <div class="sugg" id="erSugg" hidden></div>
        </div>
        <div class="seg" role="group" aria-label="보기">
          <button data-mode="q" aria-pressed="${erMode === 'q'}">분기</button><button data-mode="y" aria-pressed="${erMode === 'y'}">연간</button>
        </div>
      </div>
      <div class="chips">${POPULAR.filter(t => ER.stocks[t]).map(t => `<button data-t="${t}">${esc(ER.stocks[t].name)}</button>`).join('')}</div>
      <div class="note" id="erMsg">이 페이지의 S&P 500·나스닥·코스피·코스닥·다우 목록에 있는 ${Object.keys(ER.stocks).length}개 종목을 조회할 수 있습니다. 업데이트 ${esc(ER.updated)}</div>
    </section>
    <div id="er"></div>`;

  // 검색: 글자를 칠 때마다 맞는 종목 목록을 보여 주고, 사용자가 고르거나 Enter 를 눌러야 이동한다
  // (아이패드 사파리는 datalist 목록을 잘 못 보여 주고, change 이벤트는 입력 중 포커스만 빠져도 엉뚱한 종목을 골라 버려서 직접 만든다)
  const input = document.getElementById('erInput'), sugg = document.getElementById('erSugg');
  const open = t => { sugg.hidden = true; location.hash = 'earnings/' + encodeURIComponent(t); };
  const matches = q => {
    q = q.trim().replace(/\s*\([^)]*\)\s*$/, '');
    if (!q) return [];
    const up = q.toUpperCase(), code = t => t.replace(/\.K[SQ]$/, '');
    const rank = ([t, s]) => code(t) === up || s.name === q ? 0 : code(t).startsWith(up) || s.name.startsWith(q) ? 1 : 2;
    return Object.entries(ER.stocks)
      .filter(([t, s]) => code(t).startsWith(up) || s.name.toUpperCase().includes(up) || (s.longName || '').toUpperCase().includes(up))
      .sort((a, b) => rank(a) - rank(b) || a[1].name.localeCompare(b[1].name, 'ko'))
      .slice(0, 15);
  };
  let list = [], sel = -1;
  const show = () => {
    list = matches(input.value); sel = -1;
    if (!input.value.trim()) { sugg.hidden = true; return; }
    sugg.innerHTML = list.length
      ? list.map(([t, s], i) => `<button type="button" data-t="${t}">${esc(s.name)}<span>${t.replace(/\.K[SQ]$/, '')}${s.longName ? ' · ' + esc(s.longName) : ''}</span></button>`).join('')
      : `<div class="none">'${esc(input.value.trim())}'에 맞는 종목이 없어요. 목록에 있는 ${Object.keys(ER.stocks).length}개 종목만 조회할 수 있어요.</div>`;
    sugg.hidden = false;
  };
  input.addEventListener('focus', () => input.select());
  input.addEventListener('input', show);
  input.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;  // 한글 조합 중 Enter 는 무시
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!list.length) return;
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
      sugg.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sel));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!list.length) list = matches(input.value);
      if (list.length) open(list[Math.max(sel, 0)][0]);
      else show();
    } else if (e.key === 'Escape') sugg.hidden = true;
  });
  // 목록을 누르는 순간 입력창이 포커스를 잃어 목록이 먼저 사라지지 않게 pointerdown 에서 처리
  sugg.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); open(b.dataset.t); } });
  input.addEventListener('blur', () => setTimeout(() => { sugg.hidden = true; }, 150));
  main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { location.hash = 'earnings/' + b.dataset.t; });
  main.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    erMode = b.dataset.mode;
    try { localStorage.setItem('erMode', erMode); } catch (e) {}
    main.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (erTicker) drawEarnings(erTicker);
  });
  if (ticker) drawEarnings(ticker);
  else input.focus();
}

          <div class="s">${capInfo?.s.rank ? `${esc(capInfo.m.label)} 목록 ${capInfo.s.rank}위` : ''}${cur === 'USD' && DATA.usdkrw ? ` · 환율 ${Math.round(DATA.usdkrw).toLocaleString('ko-KR')}원` : ''}</div></div>
        <div class="kpi"><div class="k">컨센서스 상회</div><div class="v">${rated.length ? `${beats}/${rated.length}회` : '–'}</div><div class="s">최근 ${rated.length}개 분기</div></div>
        <div class="kpi"><div class="k">발표 반응(D) 평균 크기</div><div class="v">${avg == null ? '–' : '±' + avg.toFixed(1) + '%'}</div><div class="s">${avgR0.length}회 평균</div></div>
      </div>
      <div class="eq-title">주가 = EPS × PER</div>
      <div class="eq">
        <div class="kpi"><div class="k">현재가</div><div class="v">${fmtPrice(s.price, cur)}</div><div class="s">${esc(s.priceDate)} 종가</div></div>
        <div class="op">=</div>
        <div class="kpi"><div class="k">EPS (최근 1년)</div><div class="v">${fmtEps(s.ttmEps, cur)}</div><div class="s">최근 4개 분기 실제 EPS 합</div></div>
        <div class="op">×</div>
        <div class="kpi"><div class="k">현재 PER</div><div class="v">${fmtX(s.pe)}</div><div class="s">주가 ÷ 최근 1년 EPS</div></div>
      </div>
      <div class="eq">
        <div class="kpi"><div class="k">현재가</div><div class="v">${fmtPrice(s.price, cur)}</div><div class="s">같은 주가</div></div>
        <div class="op">=</div>
        <div class="kpi"><div class="k">예상 EPS (${s.ntmEps != null ? '향후 12개월' : '다음 회계연도'})</div><div class="v">${fmtEps(s.ntmEps ?? s.fwdEps, cur)}</div>
          <div class="s">${s.ntmEps != null ? `다음 회계연도${s.fwdPeriod ? `(${esc(s.fwdPeriod)})` : ''} 기준 ${fmtEps(s.fwdEps, cur)}` : '애널리스트 컨센서스'}</div></div>
        <div class="op">×</div>
        <div class="kpi"><div class="k">선행 PER</div><div class="v">${fmtX(s.ntmPe ?? s.fpe)}</div>

  let table;

  } else {
    table = `

  }
  const note = erMode === 'q'
    ? `D는 발표 후 첫 거래일입니다. 장후 발표는 다음 거래일이 D이고, 장전·장중 발표는 발표 당일이 D입니다. D·D+1·D+2는 각각 그날 하루 등락률이고, 3일 누적은 셋을 합친 수익률입니다. EPS는 야후 파이낸스 기준(미국은 대부분 조정 EPS)이고, PER은 D의 종가를 직전 4개 분기 EPS 합으로 나눈 값, 선행 PER은 같은 종가를 이후 4개 분기 컨센서스 EPS 합으로 나눈 값입니다.`
    : `연간 EPS와 컨센서스는 그 회계연도 4개 분기를 합친 값이고, 주가 반응은 4분기 실적 발표일 기준입니다. PER은 결산월 말 종가 / 연간 EPS, 선행 PER은 같은 종가 / 다음 회계연도 4개 분기 컨센서스 합입니다. 가장 최근 회계연도의 선행 PER은 진행 중인 회계연도의 현재 컨센서스를 씁니다.`;
  document.getElementById('er').innerHTML = head + bizCard(t) + `<section class="card"><div class="table-wrap">${table}</div><div class="note">${note}</div></section>`
    + `<section class="card" id="val"></section>` + `<section class="card" id="fv"></section>`;
  drawValuation(s);
  drawFairValue(s);
}

// ───── 사업 구성 ─────
function bizCard(t) {
  const b = BIZ[t];
  if (!b) return SEG[t] ? `<section class="card biz"><div class="formula">무슨 사업을 하나요?</div>${segTrend(t)}</section>` : '';
  const color = i => `var(--c${i % 6 + 1})`;
  return `
    <section class="card biz">
      <div class="formula">무슨 사업을 하나요?</div>
      <p class="lead">${esc(b.summary)}</p>
      <div class="biz-cols">
        <div>
          <div class="k" style="color:var(--muted);font-size:12px;margin-bottom:6px">매출 비중</div>
          <div class="stack">${b.segments.map((g, i) => `<span style="width:${g.pct}%;background:${color(i)}" title="${esc(g.name)} ${g.pct}%"></span>`).join('')}</div>
          ${b.segments.map((g, i) => `<div class="seg-row"><i class="dot" style="background:${color(i)}"></i><span class="nm">${esc(g.name)}</span><span class="pc">${g.pct}%</span>${g.desc ? `<span class="ds">${esc(g.desc)}</span>` : ''}</div>`).join('')}
        </div>
        <div>
          <div class="k" style="color:var(--muted);font-size:12px;margin-bottom:6px">새로 키우는 사업</div>
          ${b.new.map(n => `<div class="new-item"><b>${esc(n.name)}</b><span>${esc(n.desc)}</span></div>`).join('')}
        </div>
      </div>
      ${segTrend(t)}
      <div class="note">
        ${b.verified ? '<span class="badge ok">최근 IR 확인</span>' : '<span class="badge meet">사업보고서 기준</span>'}
        ${esc(b.basis)}.${b.approx ? ' 회사가 따로 공개하지 않은 일부 비중은 추정치라서 대략적인 크기로 봐 주세요.' : ''}
        ${b.verified ? '' : ' 최신 분기와는 다를 수 있어요.'}
        ${b.src ? ` <a href="${esc(b.src)}" target="_blank" rel="noopener">회사 IR 페이지 ↗</a>` : ''}
      </div>
    </section>`;
}

// ───── 사업부별 분기 매출 추이 (미국 SEC 공시) ─────
const fmtM = v => v == null ? '–' : Math.abs(v) >= 1000 ? '$' + (v / 1000).toFixed(1) + 'B' : '$' + Math.round(v) + 'M';
const qLabel = d => `'${d.slice(2, 4)}.${d.slice(5, 7)}`;

function segTrend(t) {
  const g = SEG[t];
  if (!g) return '';
  const n = g.quarters.length, color = i => `var(--c${i % 6 + 1})`;
  const W = 900, H = 230, padL = 52, padB = 22, padT = 8, bw = (W - padL) / n * 0.62;
  const maxV = Math.max(...g.quarters.map((_, i) => g.series.reduce((a, s) => a + (s.values[i] || 0), 0)));
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(k => maxV * k);
  let bars = '';
  g.quarters.forEach((q, i) => {
    const x = padL + (W - padL) / n * (i + 0.5) - bw / 2;
    let acc = 0;
    g.series.forEach((s, k) => {
      const v = s.values[i]; if (!v || v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v); acc += v;
      bars += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y0 - y1 - 1, 0.5).toFixed(1)}" fill="${color(k)}" rx="2"><title>${esc(s.name)} ${qLabel(q)}: ${fmtM(v)}</title></rect>`;
    });
    bars += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${qLabel(q)}</text>`;
  });
  const grid = ticks.map(v => `<line x1="${padL}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtM(v)}</text>`).join('');
  const yoy = vals => { const a = vals[n - 1], b = vals[n - 5]; return a != null && b ? (a / b - 1) * 100 : null; };
  const share = (vals) => vals[n - 1] != null && g.total[n - 1] ? vals[n - 1] / g.total[n - 1] * 100 : null;
  return `
    <div class="k" style="color:var(--muted);font-size:12px;margin:18px 0 6px">사업부별 분기 매출 추이 (SEC 공시 기준, ${esc(g.axis === 'Statement Business Segments' ? '사업부문' : g.axis === 'Product Or Service' ? '제품·서비스' : g.axis)} 구분)</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="사업부별 분기 매출 누적 막대그래프">${grid}${bars}</svg>
    <div class="table-wrap"><table class="er-table seg-table">
      <thead><tr><th>사업부</th>${g.quarters.map(q => `<th>${qLabel(q)}</th>`).join('')}<th class="grp">비중</th><th>전년 대비</th></tr></thead>
      <tbody>
        ${g.series.map((s, k) => `<tr><td><i class="dot" style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:${color(k)}"></i>${esc(s.name)}</td>
          ${s.values.map(v => `<td>${fmtM(v)}</td>`).join('')}<td class="grp">${share(s.values) == null ? '–' : share(s.values).toFixed(0) + '%'}</td><td>${fmtPct(yoy(s.values))}</td></tr>`).join('')}
        <tr><td><b>전체 매출</b></td>${g.total.map(v => `<td><b>${fmtM(v)}</b></td>`).join('')}<td class="grp">100%</td><td>${fmtPct(yoy(g.total))}</td></tr>
      </tbody>
    </table></div>
    <div class="note" style="margin-top:4px">분기 끝 달 기준이에요('26.06 = 2026년 4~6월). 사업부 이름은 회사가 공시에 쓴 그대로예요. 위의 매출 비중은 쉽게 묶은 구분이라 아래 공시 구분과 다를 수 있어요.</div>`;
}

// ───── 성장률로 보는 적정주가 (PEG 방식) ─────
const SCORES = [[-Infinity, 0, 5, '적극 매도'], [0, 5, 4, '매도 검토'], [5, 10, 3, '중립'], [10, 20, 2, '매수 검토'], [20, Infinity, 1, '적극 매수']];
const judge = up => SCORES.find(([lo, hi]) => up >= lo && up < hi);
const verdict = up => { const j = judge(up); const c = j[2] <= 2 ? 'var(--up)' : j[2] >= 4 ? 'var(--down)' : 'var(--muted)';
  return `<span class="verdict" style="color:${c};background:color-mix(in srgb, ${c} 14%, transparent)">${j[3]}</span>`; };

function drawFairValue(s) {
  const el = document.getElementById('fv'), cur = s.currency, price = s.price;
  // 이번 회계연도가 이미 끝났는데 실적 발표 전이면(예: 9월 결산 애플의 10월), 그 해는 '가장 최근(추정)'으로 보고 한 칸 민다
  const ended = !!s.fwdPeriod && s.fwdPeriod.slice(0, 7).replace('.', '-') <= s.priceDate.slice(0, 7);
  const allPast = s.diluted || [];
  const past = ended ? allPast.slice(-3) : allPast;
  const e1 = s.curEps, e2 = s.fwdEps;
  if (!past.length || e1 == null || e2 == null) {
    el.innerHTML = `<div class="formula">성장률로 보는 적정주가</div><div class="note">과거 EPS나 향후 EPS 추정치가 없어서 계산할 수 없어요.</div>`;
    return;
  }
  const cols = ended
    ? [...past.map((d, i) => ({ label: `과거 ${past.length - i}년`, fy: d.fy, eps: d.eps })),
       { label: '가장 최근 (발표 전 추정)', fy: s.curFy, eps: e1, latest: true }, { label: '향후 1년', fy: s.nextFy, eps: e2, fut: true }]
    : [...past.map((d, i) => ({ label: i === past.length - 1 ? '가장 최근' : `과거 ${past.length - 1 - i}년`, fy: d.fy, eps: d.eps, latest: i === past.length - 1 })),
       { label: '향후 1년', fy: s.curFy, eps: e1, fut: true }, { label: '향후 2년', fy: s.nextFy, eps: e2, fut: true }];
  cols.forEach((c, i) => { const p = cols[i - 1]; c.g = p && p.eps > 0 ? (c.eps / p.eps - 1) * 100 : null; });
  const unstable = cols.some(c => c.g != null && (c.g < 0 || c.g >= 50));
  const last = past[past.length - 1].eps;
  const fwd = ended ? e2 : e1;  // 적정주가에 곱하는 '향후 1년 EPS'
  const gBase = e1 > 0 ? (e2 / e1 - 1) * 100 : null;
  const gAdj = last > 0 && e2 > 0 ? (Math.pow(e2 / last, 1 / 2) - 1) * 100 : null;
  const curX = fwd > 0 ? price / fwd : null;
  const money = v => fmtPrice(cur === 'KRW' ? Math.round(v) : v, cur);
  const pct = v => `${v >= 0 ? '' : ''}${v.toFixed(1)}%`;
  const upPct = v => `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;

  const panel = (title, g, color) => {
    if (g == null || g <= 0 || fwd <= 0) return `<div class="fv-panel"><h4 style="color:${color}">${title}</h4><div class="note">성장률이 0 이하라 이 방식으로는 계산할 수 없어요.</div></div>`;
    const lo = fwd * g, hi = fwd * g * 2, bull = fwd * g * 2.5;
    const up1 = (hi / price - 1) * 100, up2 = (bull / price - 1) * 100;
    const row = (lb, a, b, sep = '~') => `<div class="fv-row"><span class="lb">${lb}</span><span>${a}</span><span>${b === '' ? '' : sep}</span><span>${b}</span></div>`;
    return `<div class="fv-panel"><h4 style="color:${color}">${title}</h4>
      ${row('평균 성장률', `<b>${pct(g)}</b>`, '')}
      ${row('적정배수 (보통)', `${g.toFixed(0)}배`, `${(g * 2).toFixed(0)}배`)}
      ${row('적정배수 (강세장)', `${(g * 1.5).toFixed(0)}배`, `${(g * 2.5).toFixed(0)}배`)}
      ${row('적정가격대', money(lo), money(hi))}
      ${row('현재 주가', money(price), '')}
      ${row('목표주가 (보통 · 강세)', `<b>${money(hi)}</b>`, `<b>${money(bull)}</b>`, '·')}
      ${row('상승여력', `${upPct(up1)}`, `${upPct(up2)}`, '·')}
      ${row('판단 (보통 기준)', verdict(up1), '')}
      ${row('현재배수', `${curX.toFixed(1)}배`, '')}
    </div>`;
  };

  el.innerHTML = `
    <div class="formula">성장률로 보는 적정주가</div>
    <div class="note" style="margin:0 0 12px; font-size:13px; line-height:1.7">
      <b>적정주가 = 향후 1년 EPS × 적정배수</b>, 적정배수는 <b>성장률 숫자 그대로</b> 써요. 성장률 30%면 30배~60배(보통), 45배~75배(강세장)예요.<br>
      보통은 성장률과 PER이 비슷하면 적당하다고 보지만, 호황·상승장에서는 프리미엄을 더 받는 경우도 있어요.
    </div>
    <div class="table-wrap"><table class="fv-eps">
      <thead><tr><th></th>${cols.map(c => `<th class="${c.latest ? 'latest' : ''}">${c.label}<br><span style="font-weight:400">${esc(c.fy || '')}</span></th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>희석 EPS</td>${cols.map(c => `<td class="${c.fut ? 'fut' : ''}">${fmtEps(c.eps, cur)}</td>`).join('')}</tr>
        <tr><td>성장률</td>${cols.map(c => `<td class="${c.fut ? 'fut' : ''}">${c.g == null ? '' : `<span class="${c.g >= 0 ? 'up' : 'down'}">${c.g.toFixed(0)}%</span>`}</td>`).join('')}</tr>
      </tbody>
    </table></div>
    <div class="note">과거는 공시된 희석 EPS, 향후 1·2년은 애널리스트 컨센서스예요(회계연도 기준).
      ${unstable ? '<b style="color:var(--up)">역성장(마이너스)이나 50% 이상 급변한 해가 있어서 ② 보정값을 보는 걸 권해요.</b>' : '성장률이 비교적 안정적이라 ① 기본값을 봐도 돼요.'}</div>
    <div class="fv-cols">
      ${panel('① 기본값', gBase, 'var(--text)')}
      ${panel('② 보정값', gAdj, 'var(--up)')}
    </div>
    <div class="note">${ended
      ? `${esc(s.curFy || '')} 회계연도는 이미 끝났지만 실적 발표 전이라 추정치를 썼어요. ① 기본값 성장률은 ${esc(s.curFy || '')} → ${esc(s.nextFy || '')} EPS 성장률이에요.
      ② 보정값은 원래 3~5년 장기 성장률(CAGR)을 쓰는데, 자동으로 받을 수 있는 값이 없어서 마지막 공시 실적(${esc(past[past.length - 1].fy)}) → 향후 1년(${esc(s.nextFy || '')}) 연평균 성장률로 대신했어요.`
      : `① 기본값 성장률은 향후 1년 → 향후 2년 EPS 성장률이에요.
      ② 보정값은 원래 3~5년 장기 성장률(CAGR)을 쓰는데, 자동으로 받을 수 있는 값이 없어서 가장 최근 실적(${esc(past[past.length - 1].fy)}) → 향후 2년(${esc(s.nextFy || '')}) 연평균 성장률로 대신했어요.`}
      이 방식은 빨리 크는 성장주에 잘 맞고, 성장은 느리지만 이익이 안정적이고 배당·자사주 매입이 많은 회사(예: 애플, 코카콜라)는 늘 낮게 나오는 한계가 있어요.
      상승여력이 마이너스로 나오면, 주가가 미래 성장을 먼저 반영하고 있거나 월가 예상치가 보수적일 수 있어요.</div>
    <div class="fv-cols">
      <div>
        <h4 style="margin:0 0 8px">③ 직접 계산</h4>
        <div class="val-inputs" style="margin:0 0 8px"><label>적정배수 <input class="num" id="fvX" type="number" step="1" min="0" value="${Math.round(gBase > 0 ? gBase : (curX ?? 20))}"> 배</label></div>
        <div id="fvOut"></div>
      </div>
      <div>
        <h4 style="margin:0 0 8px">판단 기준 (상승여력)</h4>
        <table class="score-table"><thead><tr><th>상승여력</th><th>점수</th><th>판단</th></tr></thead>
          <tbody>${SCORES.slice().reverse().map(([lo, hi, sc, lb]) => `<tr data-sc="${sc}"><td>${lo === -Infinity ? '0% 미만' : hi === Infinity ? `${lo}% 이상` : `${lo}~${hi}%`}</td><td>${sc}</td><td>${lb}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;

  const out = () => {
    const x = parseFloat(document.getElementById('fvX').value);
    if (isNaN(x) || fwd <= 0) { document.getElementById('fvOut').innerHTML = ''; return; }
    const tgt = fwd * x, up = (tgt / price - 1) * 100;
    document.getElementById('fvOut').innerHTML = `
      <div class="fv-row"><span class="lb">적정주가</span><span><b>${money(tgt)}</b></span><span></span><span></span></div>
      <div class="fv-row"><span class="lb">상승여력</span><span>${upPct(up)}</span><span></span><span>${verdict(up)}</span></div>`;
    el.querySelectorAll('.score-table tr[data-sc]').forEach(tr => tr.classList.toggle('hit', +tr.dataset.sc === judge(up)[2]));
  };
  document.getElementById('fvX').oninput = out;
  out();
}

// ───── 목표 주가 = 예상 EPS × 적정 PER ─────
const median = a => { const v = a.filter(x => x != null).sort((x, y) => x - y); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };
const STEPS = [-10, -5, 0, 5, 10];
const CASES = { '-10': '많이 보수적', '-5': '보수적', 0: '기본', 5: '낙관적', 10: '많이 낙관적' };
const fmtPctR = v => `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1)}%</span>`;

function drawValuation(s) {
  const cur = s.currency, el = document.getElementById('val');
  const ys = s.years.filter(y => y.n === 4);
  const last = ys[ys.length - 1], base3 = ys[ys.length - 4];
  const cagr = last && base3 && last.eps > 0 && base3.eps > 0 ? (Math.pow(last.eps / base3.eps, 1 / 3) - 1) * 100 : null;
  const medPe = median(ys.map(y => y.pe));
  const eps0 = s.ttmEps, fwdPe = s.ntmPe ?? s.fpe;
  if (eps0 == null || eps0 <= 0) {
    el.innerHTML = `<div class="formula">목표 주가 계산기</div><div class="note">최근 1년 EPS가 ${eps0 == null ? '없어서' : '적자라서'} 계산할 수 없어요.</div>`;
    return;
  }
  const st = { g: cagr != null ? Math.round(cagr * 10) / 10 : 10, pe: medPe != null ? Math.round(medPe * 10) / 10 : (s.pe ?? 15), yrs: 3, pes: {} };

  el.innerHTML = `
    <div class="formula">목표 주가 계산기</div>
    <div class="note" style="margin:0 0 12px; font-size:13px; line-height:1.7">
      <b>목표 주가 = 몇 년 뒤 EPS × 적정 PER</b><br>
      ① 지금 EPS는 최근 1년(4개 분기) 동안 번 주당순이익 <b>${fmtEps(eps0, cur)}</b>예요.<br>
      ② EPS가 매년 몇 %씩 늘어날지 정해요. 아래 버튼으로 고르거나 직접 입력하세요.<br>
      ③ 그때 PER을 몇 배로 쳐줄지 정해요. 기본값은 최근 몇 년 PER의 가운데 값이고, 아래 버튼으로 바꿀 수 있어요.
    </div>
    <div class="chips" style="margin:0 0 6px">
      <span class="note" style="margin:0;align-self:center">PER</span>
      ${medPe != null ? `<button data-pe="${Math.round(medPe * 10) / 10}">최근 몇 년 가운데 값 ${fmtX(medPe)}</button>` : ''}
      ${s.pe != null ? `<button data-pe="${s.pe}">현재 PER ${fmtX(s.pe)}</button>` : ''}
      ${fwdPe != null ? `<button data-pe="${fwdPe}" title="지금 주가 ÷ 향후 12개월 예상 EPS">포워드 PER ${fmtX(fwdPe)}</button>` : ''}
    </div>
    <div class="chips" style="margin:0 0 10px">
      <span class="note" style="margin:0;align-self:center">성장률</span>
      ${cagr != null ? `<button data-g="${Math.round(cagr * 10) / 10}" title="${base3.fy} ${fmtEps(base3.eps, cur)} → ${last.fy} ${fmtEps(last.eps, cur)}">지난 3년 실제 성장률 ${cagr.toFixed(1)}%</button>` : ''}
      ${s.fwdGrowth != null ? `<button data-g="${s.fwdGrowth}">애널리스트 예상 성장률 ${s.fwdGrowth.toFixed(1)}%</button>` : ''}
    </div>
    ${cagr == null ? '<div class="note" style="margin:0 0 10px">지난 3년 성장률은 적자이거나 기록이 부족해서 구할 수 없어요. 일단 10%로 넣어 뒀으니 직접 바꿔 주세요.</div>' : ''}
    <div class="val-inputs">
      <label>매년 EPS 성장률 <input class="num" id="vG" type="number" step="0.5" value="${st.g}"> %</label>
      <label>적정 PER <input class="num" id="vPe" type="number" step="0.5" min="0" value="${st.pe}"> 배</label>
      <label>몇 년 뒤 <input class="num" id="vY" type="number" step="1" min="1" max="10" value="${st.yrs}"> 년</label>
    </div>
    <div class="table-wrap"><table class="val-table">
      <thead><tr><th>경우</th><th>지금 EPS</th><th>매년 성장률</th><th id="vYh">3년 뒤 EPS</th><th>적정 PER</th><th>목표 주가</th><th>지금 주가</th><th>오를 여지</th></tr></thead>
      <tbody id="vBody"></tbody>
    </table></div>
    <h4>성장률과 PER을 같이 바꿔 보면</h4>
    <div class="note" style="margin:0 0 8px">세로는 매년 성장률, 가로는 적정 PER이에요. 칸의 숫자는 지금 주가보다 몇 % 오르거나 내릴 수 있는지예요.</div>
    <div class="table-wrap"><table class="val-table matrix"><thead id="mHead"></thead><tbody id="mBody"></tbody></table></div>
    <div class="note">EPS가 매년 같은 비율로 늘어난다고 단순하게 가정한 계산이에요. 표의 PER 칸을 눌러 경우마다 다르게 넣을 수도 있어요. 참고용일 뿐, 실제 주가를 예측하는 건 아니에요.</div>`;

  const upside = (g, pe) => { const tgt = eps0 * Math.pow(1 + g / 100, st.yrs) * pe; return { tgt, up: (tgt / s.price - 1) * 100 }; };
  const heat = v => {
    const c = v >= 0 ? 'var(--up)' : 'var(--down)', a = Math.min(Math.abs(v), 100) * 0.35;
    return `background: color-mix(in srgb, ${c} ${a.toFixed(0)}%, transparent)`;
  };
  const update = () => {
    document.getElementById('vYh').textContent = `${st.yrs}년 뒤 EPS`;
    const body = document.getElementById('vBody');
    const focused = document.activeElement?.dataset?.step;
    body.innerHTML = STEPS.map(d => {
      const g = st.g + d, pe = st.pes[d] ?? st.pe, { tgt, up } = upside(g, pe);
      return `<tr class="${d === 0 ? 'base' : ''}">
        <td>${CASES[d]}</td><td>${fmtEps(eps0, cur)}</td><td>${g.toFixed(1)}%</td>
        <td>${fmtEps(eps0 * Math.pow(1 + g / 100, st.yrs), cur)}</td>
        <td><input class="num" type="number" step="0.5" min="0" data-step="${d}" value="${pe}"> 배</td>
        <td>${fmtPrice(cur === 'KRW' ? Math.round(tgt) : tgt, cur)}</td><td>${fmtPrice(s.price, cur)}</td><td>${fmtPctR(up)}</td></tr>`;
    }).join('');
    body.querySelectorAll('input').forEach(i => i.oninput = () => {
      const v = parseFloat(i.value);
      if (!isNaN(v)) { st.pes[i.dataset.step] = v; drawMatrix(); refreshRow(i); }
    });
    if (focused != null) body.querySelector(`input[data-step="${focused}"]`)?.focus();
    drawMatrix();
  };
  const refreshRow = i => {
    const d = +i.dataset.step, g = st.g + d, { tgt, up } = upside(g, st.pes[d]);
    const tds = i.closest('tr').children;
    tds[5].innerHTML = fmtPrice(cur === 'KRW' ? Math.round(tgt) : tgt, cur);
    tds[7].innerHTML = fmtPctR(up);
  };
  const drawMatrix = () => {
    const tag = {};
    [0.5, 0.75, 1, 1.25, 1.5].forEach(k => { tag[Math.round(st.pe * k * 10) / 10] ??= ''; });
    if (s.pe != null) tag[s.pe] = '현재';
    if (fwdPe != null) tag[fwdPe] = tag[fwdPe] ? tag[fwdPe] + '·포워드' : '포워드';
    const pes = Object.keys(tag).map(Number).filter(v => v > 0).sort((a, b) => a - b);
    document.getElementById('mHead').innerHTML = `<tr><th>성장률 \\ PER</th>${pes.map(p => `<th>${tag[p] ? tag[p] + ' ' : ''}${+p.toFixed(1)}배</th>`).join('')}</tr>`;
    document.getElementById('mBody').innerHTML = STEPS.map(d => {
      const g = st.g + d;
      return `<tr class="${d === 0 ? 'base' : ''}"><td>${g.toFixed(1)}%</td>${pes.map(p => {
        const { up } = upside(g, p);
        const r = Math.round(up) || 0;
        return `<td class="cell" style="${heat(up)}">${r > 0 ? '+' : ''}${r}%</td>`;
      }).join('')}</tr>`;
    }).join('');
  };
  const bind = (id, key) => document.getElementById(id).oninput = e => {
    const v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    st[key] = key === 'yrs' ? Math.max(1, Math.min(10, Math.round(v))) : v;
    if (key === 'pe') st.pes = {};
    update();
  };
  bind('vG', 'g'); bind('vPe', 'pe'); bind('vY', 'yrs');
  el.querySelectorAll('.chips button').forEach(b => b.onclick = () => {
    if (b.dataset.g != null) { st.g = +b.dataset.g; document.getElementById('vG').value = st.g; }
    else { st.pe = +b.dataset.pe; st.pes = {}; document.getElementById('vPe').value = st.pe; }
    update();
  });
  update();
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (current) { const m = current; current = null; render(m); current = m; } });

init().catch(e => { document.getElementById('updated').textContent = '데이터를 불러오지 못했습니다: ' + e.message; });
</script>
</body>
</html>
