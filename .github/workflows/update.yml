name: 매일 주식 데이터 업데이트

on:
  schedule:
    # 한국시간 화~토 06:37 (UTC 월~금 21:37) — 미국장 마감 후. 정각은 GitHub 실행이 자주 밀려서 피함
    - cron: '37 21 * * 1-5'
  workflow_dispatch:  # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}  # SEC 공시 요청에 필요한 연락처
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/earnings.json docs/segments.json segments-cache.json docs/breadth.json sp500.csv
          git diff --cached --quiet || git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push
